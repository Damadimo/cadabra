# Base Qwen3-VL-4B + OUR LoRA adapter from any training checkpoint, one vLLM deployment serving both:
#   model="Qwen/Qwen3-VL-4B-Instruct"  -> untuned base (the "base-4b" lane)
#   model="understudy-cad-vl"          -> base + our adapter (the "specialist" lane)
# Use it to deploy an intermediate checkpoint (e.g. if the job is stopped early) or to compare base vs ours on one
# endpoint. Fill the adapter source (checkpoint directory name under $BT_CHECKPOINT_DIR, e.g. checkpoint-600), then
#   baseten model push --dir deploy/vlm_lora --wait          (or: ./scripts/deploy_vlm.sh <job_id> <gpu> <checkpoint>)
# vLLM >= 0.29: Qwen3VLForConditionalGeneration supports LoRA on the language model (our adapters touch nothing else).
model_name: understudy-cad-vl-lora
model_metadata:
  tags:
    - openai-compatible
base_image:
  image: vllm/vllm-openai:v0.29.0-cu129
weights:
  - source: "hf://Qwen/Qwen3-VL-4B-Instruct@ebb281ec70b05090aa6165b016eac8ec08e71b17"
    mount_location: "/models/qwen3-vl-4b"
    auth:
      auth_method: CUSTOM_SECRET
      auth_secret_name: "hf_access_token"
    ignore_patterns: ["*.md", ".gitattributes"]
  - source: "bt://TRAINING_PROJECT_NAME@TRAINING_JOB_ID/CHECKPOINT_NAME"  # e.g. bt://understudy-cad-vlm-sft@abc1234/checkpoint-600
    mount_location: "/models/adapter"
secrets:
  hf_access_token: null
environment_variables:
  VLLM_LOGGING_LEVEL: INFO
docker_server:
  # `find` locates the folder holding adapter_config.json wherever BDN mounts the checkpoint's files.
  start_command: >-
    sh -c 'A=$(dirname "$(find /models/adapter -name adapter_config.json | head -n1)") && echo "adapter $A" &&
    exec vllm serve /models/qwen3-vl-4b
    --served-model-name Qwen/Qwen3-VL-4B-Instruct
    --enable-lora --max-lora-rank 64 --max-loras 1
    --lora-modules understudy-cad-vl="$A"
    --host 0.0.0.0
    --port 8000
    --dtype bfloat16
    --max-model-len 8192
    --max-num-seqs 32
    --gpu-memory-utilization 0.90
    --limit-mm-per-prompt.image 4
    --limit-mm-per-prompt.video 0
    --enable-prefix-caching'
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000
resources:
  accelerator: L4  # H100_40GB (MIG) or H100 for the live race
  use_gpu: true
runtime:
  predict_concurrency: 32
  health_checks:
    startup_threshold_seconds: 1800
    restart_threshold_seconds: 600
    stop_traffic_threshold_seconds: 120
